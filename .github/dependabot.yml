version: 2
multi-ecosystem-groups:
  routine-dependencies:
    schedule:
      interval: monthly
updates:
  - package-ecosystem: pip
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: routine-dependencies
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: github-actions
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: routine-dependencies
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
