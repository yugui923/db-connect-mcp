name: Publish Python Package

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Enable Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
          job-summary: errors

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/verify_release_metadata.py --tag "$RELEASE_TAG"

      - name: Install locked build dependencies
        run: sfw uv sync --frozen --python 3.13 --dev --no-install-project

      - name: Build distributions
        run: uv build --no-build-isolation --python .venv/bin/python

      - name: Store distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/db-connect-mcp

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # Skip if version already exists

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build, verify-testpypi]
    if: startsWith(github.ref, 'refs/tags/v') # Only on version tags
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/db-connect-mcp

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl

  verify-testpypi:
    name: Verify TestPyPI artifacts
    needs: [build, publish-to-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify TestPyPI artifacts
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: >-
          python .github/scripts/verify-pypi-artifacts.py
          --repository-url https://test.pypi.org
          --version "${PACKAGE_VERSION#v}"
          --dist-dir dist

  verify-pypi:
    name: Verify PyPI artifacts
    needs: [build, publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify PyPI artifacts
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: >-
          python .github/scripts/verify-pypi-artifacts.py
          --repository-url https://pypi.org
          --version "${PACKAGE_VERSION#v}"
          --dist-dir dist
