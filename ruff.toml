line-length = 88
indent-width = 4

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[lint]
# Preserve Ruff's pre-0.16 default rule set. Ruff 0.16 expanded its defaults
# from 59 to 413 rules; adopting those additional rules belongs in a dedicated
# lint-policy change rather than a dependency refresh.
select = ["E4", "E7", "E9", "F"]


[lint.per-file-ignores]
"__init__.py" = ["F401"]


[format]
quote-style = "double"
indent-style = "space"
